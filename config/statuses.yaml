# ==========================================================
#  Швидкі повідомлення клієнту — кнопки в картці замовлення.
#  Менеджер натискає кнопку, клієнт одразу отримує текст.
#
#  Доступні підстановки в тексті:
#    {order_id}     номер заявки
#    {route}        Київ → Львів
#    {pickup_city}  {dropoff_city}
#    {pickup_date}  дата подачі
#    {client_name}  ім'я клієнта
#    {total}        сума прорахунку
#  Якщо даних немає — підставиться «—», текст не зламається.
#
#  order_status (необов'язково) — у який статус перевести заявку:
#    new | in_progress | done | cancelled
# ==========================================================
version: 1

statuses:
  - id: accepted
    label: "✅ Прийнято в роботу"
    order_status: in_progress
    text: |
      ✅ Вашу заявку №{order_id} прийнято в роботу.
      Маршрут: {route}
      Подача: {pickup_date}

      Менеджер на зв'язку — пишіть сюди, якщо є питання.

  - id: driver_assigned
    label: "👨‍✈️ Водія призначено"
    order_status: in_progress
    text: |
      👨‍✈️ За вашою заявкою №{order_id} призначено водія.
      Контакти водія надішлемо перед подачею авто.

  - id: departed
    label: "🚚 Авто виїхало"
    order_status: in_progress
    text: |
      🚚 Авто виїхало за вашим вантажем.
      Заявка №{order_id}, маршрут {route}.

  - id: loaded
    label: "📦 Вантаж завантажено"
    order_status: in_progress
    text: |
      📦 Вантаж завантажено, авто вирушило за маршрутом {route}.
      Заявка №{order_id}.

  - id: delayed
    label: "⏳ Затримується"
    order_status: in_progress
    text: |
      ⏳ За заявкою №{order_id} є затримка.
      Ми вже з'ясовуємо деталі й повідомимо новий час найближчим часом.
      Перепрошуємо за незручності.

  - id: arrived
    label: "📍 Авто прибуло"
    order_status: in_progress
    text: |
      📍 Авто прибуло на місце за заявкою №{order_id}.
      Маршрут: {route}.

  - id: delivered
    label: "🏁 Доставлено"
    order_status: done
    text: |
      🏁 Вантаж за заявкою №{order_id} доставлено.
      Дякуємо, що обрали нас! Будемо раді новим замовленням — /start

  - id: cancelled
    label: "❌ Скасовано"
    order_status: cancelled
    text: |
      ❌ Заявку №{order_id} скасовано.
      Якщо це помилка — напишіть сюди, ми відновимо замовлення.
