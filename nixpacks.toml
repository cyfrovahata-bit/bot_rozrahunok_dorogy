# Збірка на Railway. Одна репліка, без HTTP-порту: бот працює через
# long polling, тому healthcheck і домен не потрібні.
[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "python -m delivery.bot.telegram"
